# 로컬과 운영이 같은 파일을 쓴다. 운영 전용 값(비밀번호·프로파일)은 서버의 `.env` 로만 주입하고,
# 여기 적힌 기본값은 전부 로컬용이다 — 값이 두 파일로 갈라지면 반드시 어긋난다.
#
# json-file 은 기본적으로 컨테이너 로그를 크기 제한 없이 쌓는다. 작은 VM 에서는 메모리보다
# 디스크가 먼저 차므로 세 서비스 전부에 rotation 을 건다.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: swyp
      POSTGRES_USER: swyp
      # 운영 비밀번호는 서버 `.env` 에서 온다. 이 값은 **볼륨을 처음 초기화할 때만** 적용되므로
      # 첫 배포 후에 바꾸면 인증 실패한다(볼륨을 지우기 전까지 반영되지 않는다).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swyp}
    # 루프백에만 바인딩한다. 컨테이너끼리는 도커 네트워크로 붙으므로(`postgres:5432`) 이 바인딩과
    # 무관하고, 운영에서 방화벽(ACG) 하나에만 의존하지 않게 된다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    <<: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swyp -d swyp"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 이 앱이 Redis 에 쓰는 키는 refresh 토큰뿐이고 전부 TTL 이 걸려 있다(RefreshTokenService).
    # 그래서 volatile-lru 의 축출 대상이 항상 존재한다 — 상한에 닿아도 OOM 을 반환하지 않고,
    # 축출되는 것도 "어차피 곧 사라질 것들"로 제한된다.
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 320m
    <<: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 전체 스택을 도커로 띄울 때만 사용: `docker compose --profile app up`.
  # profile을 걸어 두어 기본 `docker compose up` 및 bootRun의 docker-compose 자동관리에서는
  # 제외된다(앱이 자기 자신을 기동하는 순환 방지). 앱 컨테이너는 developmentOnly 모듈이 jar에
  # 없으므로 아래 env로 서비스명(postgres/redis)에 직접 연결한다.
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 서버 `.env` 에서만 `prod` 로 준다. 여기에 prod 를 박으면 로컬에서 전체 스택을 띄울 때도
      # 운영 프로파일이 켜져 swagger 가 사라진다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swyp
      SPRING_DATASOURCE_USERNAME: swyp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swyp}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # compose 는 프로젝트 루트 .env 를 변수 치환에만 쓰고 컨테이너에 자동 주입하지 않으므로,
      # 카카오 앱 ID도 다른 항목들처럼 여기서 명시적으로 넘겨야 한다(빠져 있으면 .env 에 값이
      # 있어도 컨테이너는 못 보고 "앱 ID 미설정"으로 기동한다). long 에 바인딩되므로(
      # application.properties) 빈 문자열이면 파싱에 실패한다 — 기본값을 문자열 "0"으로 줘서
      # 미설정 상태(fail-closed)를 유지한다.
      KAKAO_CONSUMER_APP_ID: ${KAKAO_CONSUMER_APP_ID:-0}
      KAKAO_OWNER_APP_ID: ${KAKAO_OWNER_APP_ID:-0}
      # 웹(JS SDK) 카카오 로그인의 인가 코드 교환용 REST API 키. 문자열이라 빈 값이어도
      # 바인딩엔 문제없다 — 비어 있으면 교환 요청만 카카오에서 거부된다(fail-closed).
      KAKAO_CONSUMER_REST_API_KEY: ${KAKAO_CONSUMER_REST_API_KEY:-}
      KAKAO_OWNER_REST_API_KEY: ${KAKAO_OWNER_REST_API_KEY:-}
      # compose 는 프로젝트 루트 `.env` 를 변수 치환에만 쓴다(컨테이너 자동 주입 아님).
      # 그래서 여기서 명시적으로 넘긴다. `.env` 가 없으면 빈 값 → 앱은 그대로 뜬다.
      MFDS_API_KEY: ${MFDS_API_KEY:-}
      # 기본값이 없다. 비어 있으면 JwtProperties 가 기동을 막고 이유를 알려준다.
      JWT_SECRET: ${JWT_SECRET:-}
      # mem_limit 만 걸면 JVM 은 컨테이너 메모리의 기본 25% 만 힙으로 잡는다(1300m 기준 325MB).
      # 힙 ~975MB + 메타스페이스/스레드/JIT ~325MB 로 명시 배분한다.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    mem_limit: 1300m
    <<: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: swyp
      MYSQL_USER: swyp
      MYSQL_PASSWORD: swyp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 전체 스택을 도커로 띄울 때만 사용: `docker compose --profile app up`.
  # profile을 걸어 두어 기본 `docker compose up` 및 bootRun의 docker-compose 자동관리에서는
  # 제외된다(앱이 자기 자신을 기동하는 순환 방지). 앱 컨테이너는 developmentOnly 모듈이 jar에
  # 없으므로 아래 env로 서비스명(mysql/redis)에 직접 연결한다.
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/swyp
      SPRING_DATASOURCE_USERNAME: swyp
      SPRING_DATASOURCE_PASSWORD: swyp
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:

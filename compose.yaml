services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: swyp
      POSTGRES_USER: swyp
      POSTGRES_PASSWORD: swyp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swyp -d swyp"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 전체 스택을 도커로 띄울 때만 사용: `docker compose --profile app up`.
  # profile을 걸어 두어 기본 `docker compose up` 및 bootRun의 docker-compose 자동관리에서는
  # 제외된다(앱이 자기 자신을 기동하는 순환 방지). 앱 컨테이너는 developmentOnly 모듈이 jar에
  # 없으므로 아래 env로 서비스명(postgres/redis)에 직접 연결한다.
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swyp
      SPRING_DATASOURCE_USERNAME: swyp
      SPRING_DATASOURCE_PASSWORD: swyp
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # compose 는 프로젝트 루트 `.env` 를 변수 치환에만 쓴다(컨테이너 자동 주입 아님).
      # 그래서 여기서 명시적으로 넘긴다. `.env` 가 없으면 빈 값 → 앱은 그대로 뜬다.
      MFDS_API_KEY: ${MFDS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

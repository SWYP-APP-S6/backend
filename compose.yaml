# 로컬과 운영이 같은 파일을 쓴다. 운영 전용 값(비밀번호·프로파일)은 서버의 `.env` 로만 주입하고,
# 여기 적힌 기본값은 전부 로컬용이다 — 값이 두 파일로 갈라지면 반드시 어긋난다.
#
# json-file 은 기본적으로 컨테이너 로그를 크기 제한 없이 쌓는다. 작은 VM 에서는 메모리보다
# 디스크가 먼저 차므로 세 서비스 전부에 rotation 을 건다.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: swyp
      POSTGRES_USER: swyp
      # 운영 비밀번호는 서버 `.env` 에서 온다. 이 값은 **볼륨을 처음 초기화할 때만** 적용되므로
      # 첫 배포 후에 바꾸면 인증 실패한다(볼륨을 지우기 전까지 반영되지 않는다).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swyp}
    # 루프백에만 바인딩한다. 컨테이너끼리는 도커 네트워크로 붙으므로(`postgres:5432`) 이 바인딩과
    # 무관하고, 운영에서 방화벽(ACG) 하나에만 의존하지 않게 된다.
    ports:
      # 호스트 포트만 `.env` 로 옮길 수 있게 둔다 — 같은 머신의 다른 프로젝트가 5432 를 이미
      # 쓰고 있을 때 로컬에서만 비켜간다. 운영은 이 값을 주지 않으므로 5432 그대로다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    <<: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swyp -d swyp"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 이 앱이 Redis 에 쓰는 키는 refresh 토큰(RefreshTokenService), guest 토큰·발급 제한
    # (GuestTokenService), 분당 rate limit 카운터(RateLimiter)이고 전부 TTL 이 걸려 있다.
    # 그래서 volatile-lru 의 축출 대상이 항상 존재한다 — 상한에 닿아도 OOM 을 반환하지 않고,
    # 축출되는 것도 "어차피 곧 사라질 것들"로 제한된다. 단, 축출 대상에 refresh 토큰도 포함되므로
    # /auth/guest 는 nginx limit_req 로 IP 단위 발급을 막아야 한다(docs/guest-browsing-design.md §4.1).
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 320m
    <<: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 전체 스택을 도커로 띄울 때만 사용: `docker compose --profile app up`.
  # profile을 걸어 두어 기본 `docker compose up` 및 bootRun의 docker-compose 자동관리에서는
  # 제외된다(앱이 자기 자신을 기동하는 순환 방지). 앱 컨테이너는 developmentOnly 모듈이 jar에
  # 없으므로 아래 env로 서비스명(postgres/redis)에 직접 연결한다.
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 서버 `.env` 에서만 `prod` 로 준다. 여기에 prod 를 박으면 로컬에서 전체 스택을 띄울 때도
      # 운영 프로파일이 켜져 swagger 가 사라진다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swyp
      SPRING_DATASOURCE_USERNAME: swyp
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swyp}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # 베이스 이미지에 TZ 설정이 없어 JVM 기본 시간대가 UTC 다. 벽시계 기반 값(픽업 마감 시간
      # 등)은 `ClockConfig` 의 Clock 빈이 Asia/Seoul 로 고정하지만, 로그 타임스탬프처럼 JVM
      # 기본 시간대를 쓰는 것들까지 맞추려면 컨테이너 TZ 도 함께 줘야 한다.
      TZ: Asia/Seoul
      # compose 는 프로젝트 루트 .env 를 변수 치환에만 쓰고 컨테이너에 자동 주입하지 않으므로,
      # 카카오 앱 ID도 다른 항목들처럼 여기서 명시적으로 넘겨야 한다(빠져 있으면 .env 에 값이
      # 있어도 컨테이너는 못 보고 "앱 ID 미설정"으로 기동한다). long 에 바인딩되므로(
      # application.properties) 빈 문자열이면 파싱에 실패한다 — 기본값을 문자열 "0"으로 줘서
      # 미설정 상태(fail-closed)를 유지한다.
      KAKAO_CONSUMER_APP_ID: ${KAKAO_CONSUMER_APP_ID:-0}
      KAKAO_OWNER_APP_ID: ${KAKAO_OWNER_APP_ID:-0}
      # 웹(JS SDK) 카카오 로그인의 인가 코드 교환용 REST API 키. 문자열이라 빈 값이어도
      # 바인딩엔 문제없다 — 비어 있으면 교환 요청만 카카오에서 거부된다(fail-closed).
      KAKAO_CONSUMER_REST_API_KEY: ${KAKAO_CONSUMER_REST_API_KEY:-}
      KAKAO_OWNER_REST_API_KEY: ${KAKAO_OWNER_REST_API_KEY:-}
      # 해당 앱에서 Client Secret 이 켜져 있으면 필수 — 꺼져 있으면 빈 값으로 둬도 된다.
      KAKAO_CONSUMER_CLIENT_SECRET: ${KAKAO_CONSUMER_CLIENT_SECRET:-}
      KAKAO_OWNER_CLIENT_SECRET: ${KAKAO_OWNER_CLIENT_SECRET:-}
      # 점주 가게 등록(O-003-02)의 주소 → 좌표 변환용. 로그인 앱 키와 무관한 별개 카카오 앱 키다.
      KAKAO_LOCAL_REST_API_KEY: ${KAKAO_LOCAL_REST_API_KEY:-}
      # compose 는 프로젝트 루트 `.env` 를 변수 치환에만 쓴다(컨테이너 자동 주입 아님).
      # 그래서 여기서 명시적으로 넘긴다. `.env` 가 없으면 빈 값 → 앱은 그대로 뜬다.
      MFDS_API_KEY: ${MFDS_API_KEY:-}
      # 기본값이 없다. 비어 있으면 JwtProperties 가 기동을 막고 이유를 알려준다.
      JWT_SECRET: ${JWT_SECRET:-}
      # FCM 푸시. 서비스 계정 JSON 을 파일로 마운트하지 않고 base64 한 줄로 넘긴다 — 호스트에
      # 파일이 없으면 도커가 마운트 지점에 빈 디렉터리를 만들어 로컬에서 조용히 깨지고, 이
      # 프로젝트의 비밀값은 전부 `.env` 한 곳에서 온다. 비어 있으면 발송만 꺼진다(앱은 뜨고
      # 알림은 인앱 알림함까지 간다).
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_BASE64: ${FCM_CREDENTIALS_BASE64:-}
      # 앱이 만드는 알림 채널 id. Android 8+ 는 채널이 필수라 값이 어긋나면 푸시가 도착해도
      # 트레이에 뜨지 않는다 — 앱 개발자와 맞춘 값을 넣는다.
      FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-}
      # mem_limit 만 걸면 JVM 은 컨테이너 메모리의 기본 25% 만 힙으로 잡는다(1300m 기준 325MB).
      # 힙 ~975MB + 메타스페이스/스레드/JIT ~325MB 로 명시 배분한다.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    mem_limit: 1300m
    <<: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

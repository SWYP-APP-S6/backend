version: 2
updates:
  # Gradle dependencies (Spring, jjwt, springdoc, archunit, …)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Collapse routine minor/patch bumps into one PR to cut noise.
      gradle-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions versions used in the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

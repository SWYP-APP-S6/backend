name: CI

# Every PR to main, and every push to main. Feature work integrates via PR; main also receives
# direct pushes (e.g. the harness bootstrap), so both paths are gated by the same build.
#
# Deployment deliberately does NOT live here. This repository is public, and a self-hosted runner
# on a public repository lets a fork's pull request execute code on the deployment host. The
# server pulls instead (scripts/deploy.sh) — see DEPLOY.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # `./gradlew build` compiles, runs tests, and assembles the jar. Tests boot a real PostgreSQL
      # (and Redis) via Testcontainers (@ServiceConnection) — the ubuntu runner provides the Docker daemon.
      - run: ./gradlew build --no-daemon

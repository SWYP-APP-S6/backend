name: CI

# Every PR and push to main and dev. Feature work merges into dev (deployed to the dev server),
# then dev merges into main (deployed to production), so both branches are gated by the same build.
#
# Deployment deliberately does NOT live here. This repository is public, and a self-hosted runner
# on a public repository lets a fork's pull request execute code on the deployment host. The
# server pulls instead (scripts/deploy.sh) — see DEPLOY.md.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # `./gradlew build` compiles, runs tests, and assembles the jar. Tests boot a real PostgreSQL
      # (and Redis) via Testcontainers (@ServiceConnection) — the ubuntu runner provides the Docker daemon.
      - run: ./gradlew build --no-daemon

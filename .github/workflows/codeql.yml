name: CodeQL

# Static security analysis (SAST) — free on public repos. Not a required check; informational.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1" # weekly, Mondays 02:30 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Compile only — CodeQL needs the classes, not the test run (so no Docker/Testcontainers here).
      - run: ./gradlew compileJava compileTestJava --no-daemon

      - uses: github/codeql-action/analyze@v4

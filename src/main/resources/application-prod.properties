# 운영 프로파일. `SPRING_PROFILES_ACTIVE=prod` 로 활성화한다.
#
# API 명세를 인증 없이 공개하지 않는다. springdoc 이 꺼지면 /v3/api-docs 와 /swagger-ui 가
# 사라지고, SecurityConfig 도 같은 스위치를 보므로 permitAll 규칙까지 함께 내려간다
# (프로파일만 바꿔서 문서를 다시 켜면 보안 규칙도 따라 켜진다 — 둘이 어긋날 수 없다).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# nginx 리버스 프록시 뒤에서 돈다. 이 설정이 없으면 앱이 요청을 평문 HTTP 로 인식해
# request.isSecure() 가 false 가 되고, Spring Security 가 HSTS 헤더를 붙이지 않는다.
# 절대 URL(리다이렉트 Location 등)도 http:// 로 새어 나간다.
#
# native = 서블릿 컨테이너(Tomcat RemoteIpValve)의 네이티브 지원. framework 와 달리
# 신뢰할 프록시 대역(internalProxies, 기본값에 172.16/12 포함 — 도커 브리지)에서 온
# 요청에만 X-Forwarded-* 를 반영한다.
server.forward-headers-strategy=native

# 운영에서는 관리자 웹 오리진만 허용한다(로컬 dev 오리진을 상속하지 않도록 여기서 덮어쓴다).
cors.allowed-origins=https://admin.mangro.cloud

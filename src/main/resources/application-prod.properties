# 운영 프로파일. `SPRING_PROFILES_ACTIVE=prod` 로 활성화한다.
#
# API 명세를 인증 없이 공개하지 않는다. springdoc 이 꺼지면 /v3/api-docs 와 /swagger-ui 가
# 사라지고, SecurityConfig 도 같은 스위치를 보므로 permitAll 규칙까지 함께 내려간다
# (프로파일만 바꿔서 문서를 다시 켜면 보안 규칙도 따라 켜진다 — 둘이 어긋날 수 없다).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.application.name=backend

# Flyway owns the schema; Hibernate only validates entities against it (never mutates).
spring.jpa.hibernate.ddl-auto=validate

# JWT 서명 키(HMAC-SHA256, 32바이트 이상). 기본값을 두지 않는다 — 기본값이 있으면 운영에서
# 환경변수를 빠뜨렸을 때 공개 저장소에 적힌 키로 조용히 떨어져 누구나 admin 토큰을 위조할 수
# 있다. 미설정이면 기동이 실패한다. 로컬은 `.env`(.env.example 참고), 테스트는 build.gradle.kts.
jwt.secret=${JWT_SECRET}
jwt.access-ttl=30m
jwt.refresh-ttl=14d

# MFDS 조리식품 레시피 DB (COOKRCP01). 레시피 수집 배치에서만 쓴다 — 키가 비어 있어도 앱은 뜬다.
mfds.base-url=http://openapi.foodsafetykorea.go.kr
mfds.api-key=${MFDS_API_KEY:}

# 관리자 웹(admin-web)이 다른 오리진에서 이 API 를 호출한다. 기본값은 Vite dev 서버이고,
# 운영 오리진은 application-prod.properties 가 덮어쓴다 — dev 오리진이 운영에 남으면 안 된다.
cors.allowed-origins=http://localhost:5173

# 카카오 로그인(소비자 앱·점주 앱 전용 — 관리자 백오피스는 email+password 를 쓴다).
# 소비자 앱과 점주 앱은 **별개의 카카오 앱**이라 앱 ID 도 두 개다(콘솔의 숫자 '앱 ID' — REST API
# 키가 아니다). 앱이 넘긴 access token 이 그 앱에서 발급된 것인지 확인하는 데 쓴다 — 이 검증이
# 없으면 다른 앱의 토큰으로 남의 계정에 로그인할 수 있다.
# 미설정(0)이면 해당 앱의 카카오 로그인이 전부 거부된다(fail-closed, 기동은 된다).
kakao.api-base-url=https://kapi.kakao.com
kakao.consumer-app-id=${KAKAO_CONSUMER_APP_ID:0}
kakao.owner-app-id=${KAKAO_OWNER_APP_ID:0}

# 웹(JS SDK) 카카오 로그인의 인가 코드 → access token 교환용(REST API 키, 앱 ID 아님). admin-web
# 의 카카오 로그인 테스트 페이지(/kakao-test) 전용 — 네이티브 앱은 SDK가 토큰을 직접 주므로
# 이 교환이 필요 없다. 비어 있으면 교환 요청이 카카오에서 거부된다(fail-closed).
kakao.auth-base-url=https://kauth.kakao.com
kakao.consumer-rest-api-key=${KAKAO_CONSUMER_REST_API_KEY:}
kakao.owner-rest-api-key=${KAKAO_OWNER_REST_API_KEY:}

# 카카오가 응답하지 않을 때 요청 스레드를 무한정 붙잡고 있지 않도록 한다.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s

# 신규 유저가 약관 동의(C-002)를 마칠 때까지만 유효한 1회용 가입 토큰의 수명.
# 이 토큰이 있는 동안에는 users row 가 아직 없다 — 이탈하면 아무 계정도 남지 않는다.
auth.signup-ttl=10m

spring.application.name=backend

# Flyway owns the schema; Hibernate only validates entities against it (never mutates).
spring.jpa.hibernate.ddl-auto=validate

# JWT 서명 키(HMAC-SHA256, 32바이트 이상). 기본값을 두지 않는다 — 기본값이 있으면 운영에서
# 환경변수를 빠뜨렸을 때 공개 저장소에 적힌 키로 조용히 떨어져 누구나 admin 토큰을 위조할 수
# 있다. 미설정이면 기동이 실패한다. 로컬은 `.env`(.env.example 참고), 테스트는 build.gradle.kts.
jwt.secret=${JWT_SECRET}
jwt.access-ttl=30m
# guest 토큰은 refresh 가 없어 access 보다 길다(docs/guest-browsing-design.md §2).
jwt.guest-access-ttl=24h
jwt.refresh-ttl=14d

# MFDS 조리식품 레시피 DB (COOKRCP01). 레시피 수집 배치에서만 쓴다 — 키가 비어 있어도 앱은 뜬다.
mfds.base-url=http://openapi.foodsafetykorea.go.kr
mfds.api-key=${MFDS_API_KEY:}

# 관리자 웹(admin-web)이 다른 오리진에서 이 API 를 호출한다. 기본값은 Vite dev 서버이고,
# 운영 오리진은 application-prod.properties 가 덮어쓴다 — dev 오리진이 운영에 남으면 안 된다.
cors.allowed-origins=http://localhost:5173

# 카카오 로그인(소비자 앱·점주 앱 전용 — 관리자 백오피스는 email+password 를 쓴다).
# 소비자 앱과 점주 앱은 **별개의 카카오 앱**이라 앱 ID 도 두 개다(콘솔의 숫자 '앱 ID' — REST API
# 키가 아니다). 앱이 넘긴 access token 이 그 앱에서 발급된 것인지 확인하는 데 쓴다 — 이 검증이
# 없으면 다른 앱의 토큰으로 남의 계정에 로그인할 수 있다.
# 미설정(0)이면 해당 앱의 카카오 로그인이 전부 거부된다(fail-closed, 기동은 된다).
kakao.api-base-url=https://kapi.kakao.com
kakao.consumer-app-id=${KAKAO_CONSUMER_APP_ID:0}
kakao.owner-app-id=${KAKAO_OWNER_APP_ID:0}

# 웹(JS SDK) 카카오 로그인의 인가 코드 → access token 교환용(REST API 키, 앱 ID 아님). admin-web
# 의 카카오 로그인 테스트 페이지(/kakao-test) 전용 — 네이티브 앱은 SDK가 토큰을 직접 주므로
# 이 교환이 필요 없다. 비어 있으면 교환 요청이 카카오에서 거부된다(fail-closed).
kakao.auth-base-url=https://kauth.kakao.com
kakao.consumer-rest-api-key=${KAKAO_CONSUMER_REST_API_KEY:}
kakao.owner-rest-api-key=${KAKAO_OWNER_REST_API_KEY:}
kakao.consumer-client-secret=${KAKAO_CONSUMER_CLIENT_SECRET:}
kakao.owner-client-secret=${KAKAO_OWNER_CLIENT_SECRET:}

# 점주 가게 등록(O-003-02)의 주소 → 좌표 변환. 로그인용 앱 키와 무관한 별도 값이다 — 카카오
# 로컬(카카오맵) 제품을 활성화한 앱의 REST API 키를 쓴다. 비어 있으면 가게 등록이 거부된다.
kakao.local-api-base-url=https://dapi.kakao.com
kakao.local-rest-api-key=${KAKAO_LOCAL_REST_API_KEY:}

# 카카오가 응답하지 않을 때 요청 스레드를 무한정 붙잡고 있지 않도록 한다.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s

# 신규 유저가 약관 동의(C-002)를 마칠 때까지만 유효한 1회용 가입 토큰의 수명.
# 이 토큰이 있는 동안에는 users row 가 아직 없다 — 이탈하면 아무 계정도 남지 않는다.
auth.signup-ttl=10m

# 비회원 구경하기(docs/guest-browsing-design.md). guest 토큰은 인증 수단이 아니라 rate limit 키다 —
# refresh 없이 만료되면 앱이 /auth/guest 를 다시 부른다(수명은 jwt.guest-access-ttl). 같은 installId 로
# 하루에 낼 수 있는 발급 횟수를 제한해 재발급 루프를 막는다(IP 단위 제한은 nginx limit_req 가 맡는다).
auth.guest-issue-limit-per-day=10

# 인증된 주체(realm+principal) 단위 분당 요청 한도. Redis 고정 창(INCR+EXPIRE), 초과 시 429.
# Redis 가 죽으면 제한 없이 통과시킨다(fail-open) — 조회 API 전체가 Redis 에 묶이지 않게.
ratelimit.per-minute.guest=60
ratelimit.per-minute.user=120
ratelimit.per-minute.admin=300

# fail-open 이 실제로 동작하려면 Redis 가 빨리 실패해야 한다. Lettuce 기본 명령 타임아웃은 60초라,
# Redis 가 거부(refused)가 아니라 무응답이면 모든 인증 요청이 60초씩 매달린다. 1초면 충분히 짧고
# 로컬/같은 VM 의 Redis 에는 넉넉하다(refresh 회전에도 같은 값이 적용된다).
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# 소비자 홈 목록(FR-001)의 탐색 반경. 지도는 클라이언트가 보낸 뷰포트(bbox)를 쓰고, 목록은 이 반경으로
# 고정한다 — 목록이 줌 레벨에 따라 결과가 달라지면 "총 N개"가 무엇을 센 값인지 알 수 없어진다.
browse.nearby-radius-meters=1000

# 지도 한 화면에 내려보낼 매장 마커의 상한. 넘으면 뷰포트 중심에 가까운 순으로 자르고
# truncated=true 로 알린다 — 전국 단위로 줌아웃했을 때 응답이 무한정 커지지 않게.
browse.map-marker-limit=200

# 지도 뷰포트의 한 변 상한. 넘으면 400 이다 — 마커 상한은 응답 크기만 줄이지 작업량은 줄이지
# 못해서, 전 지구 bbox 한 번이 승인된 매장 전체를 메모리에 올린다. 전국 단위로 줌아웃하면
# 개별 핀을 그릴 이유도 없으므로, 조용히 좁히는 것보다 클라이언트에 알리는 쪽이 낫다.
browse.max-viewport-span-meters=100000

# 로컬 테스트용 토큰 발급(POST /dev/test-token). 카카오 왕복 없이 소비자/점주 access 토큰을 받아
# 관리자 페이지에서 앱 전용 API 를 호출해 보기 위한 것이다. 운영 프로파일이 false 로 덮어쓰고,
# 그때는 컨트롤러 빈 자체가 만들어지지 않는다(SecurityConfig 도 같은 스위치를 본다 — 규칙과
# 엔드포인트가 어긋날 수 없다).
dev.test-token.enabled=true
# 찜(C-021). ttl 은 "최대"다 — 픽업 마감이 더 이르면 그쪽으로 잘린다(min), 19:59 에 찜하면 1분짜리가
# 생긴다. user-qty-limit 은 **1회 수량** 상한이고(V0006 의 BR-017 주석이 qty 컬럼에 달려 있다)
# 동시 보유 건수는 제한하지 않는다. expiry-scan-interval 은 만료 배치 주기.
hold.ttl=15m
hold.user-qty-limit=3
hold.expiry-scan-interval=1m

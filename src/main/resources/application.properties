spring.application.name=backend

# Flyway owns the schema; Hibernate only validates entities against it (never mutates).
spring.jpa.hibernate.ddl-auto=validate

# JWT. Secret must be >= 32 bytes (HMAC-SHA256); the default is dev-only — set JWT_SECRET in real envs.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789abcdef}
jwt.access-ttl=30m
jwt.refresh-ttl=14d

# MFDS 조리식품 레시피 DB (COOKRCP01). 레시피 수집 배치에서만 쓴다 — 키가 비어 있어도 앱은 뜬다.
mfds.base-url=http://openapi.foodsafetykorea.go.kr
mfds.api-key=${MFDS_API_KEY:}
